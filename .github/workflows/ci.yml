name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build test image (Python ${{ matrix.python-version }})
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} --file Dockerfile.ci --tag promptmigrate-ci:${{ matrix.python-version }} .
      - name: Run complete suite in container
        run: docker run --rm promptmigrate-ci:${{ matrix.python-version }}
  native-test:
    # Docker only covers Linux; the store has Windows-only paths (named mutex, junctions, UNC URIs, reserved names)
    # and macOS has a case-insensitive filesystem, so both run natively.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v
