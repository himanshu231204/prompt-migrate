name: CI
on:
  push:
  pull_request:
jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Build test image (Python ${{ matrix.python-version }})
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python-version }} --file Dockerfile.ci --tag promptmigrate-ci:${{ matrix.python-version }} .
      - name: Run complete suite in container
        run: docker run --rm promptmigrate-ci:${{ matrix.python-version }}
