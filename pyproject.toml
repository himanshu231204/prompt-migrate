[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptmigrate"
version = "0.1.0"
description = "Alembic-inspired migration control for production AI prompts and agent configurations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PromptMigrate contributors" }]
keywords = ["llm", "prompt", "migration", "version-control", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Version Control",
]

[project.scripts]
promptmigrate = "promptmigrate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
